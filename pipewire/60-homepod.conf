# PipeWire drop-in configuration for Apple HomePod mini virtual sink
# Installed to ~/.config/pipewire/pipewire.conf.d/60-homepod.conf
# or /usr/share/pipewire/pipewire.conf.d/60-homepod.conf
#
# Architectural Features:
# 1. Bit-Perfect PCM Stream:
#    monitor.channel-volumes = false ensures zero digital software volume truncation.
#    The digital audio stream remains bit-perfect at 0 dBFS unity gain, allowing sonus
#    to drive the HomePod's Apple S5 hardware DSP amplifier via RTSP SET_PARAMETER volume.
#
# 2. Sub-250ms Interactive Latency & A/V Lip-Sync Injection:
#    latency.internal.rate = 11025, latency.internal.ns = 250000000 (250ms @ 44.1 kHz)
#    informs connected clients (Google Chrome, Firefox, MPV, VLC) to delay video rendering
#    by exactly 250ms, eliminating lip-sync lag completely.
#
# 3. Audiophile Resampling Quality:
#    resample.quality = 10 guarantees studio-grade sinc interpolation whenever any
#    application outputs non-44.1kHz audio.

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Apple HomePod mini (Office)"
            audio.rate = 44100
            audio.channels = 2
            audio.position = [ FL FR ]
            resample.quality = 10
            capture.props = {
                node.name = "HomePod"
                node.description = "Apple HomePod mini (Office)"
                media.class = "Audio/Sink"
                audio.rate = 44100
                audio.channels = 2
                audio.position = [ FL FR ]
                resample.quality = 10
                # Preserve 100% bit-perfect digital PCM for hardware S5 DSP amplification
                monitor.channel-volumes = false
                # 250ms presentation delay compensation for browser/player video sync
                latency.internal.rate = 11025
                latency.internal.ns = 250000000
            }
            playback.props = {
                node.name = "playback.HomePod"
                audio.rate = 44100
                audio.channels = 2
                audio.position = [ FL FR ]
                resample.quality = 10
                node.passive = true
                stream.dont-remix = true
            }
        }
    }
]
